name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Generated code matches spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dart-lang/setup-dart@v1

      - name: Regenerate from openapi.json
        run: |
          chmod +x scripts/regen.sh
          ./scripts/regen.sh

      - name: Client matches the committed spec
        # lib/ and doc/ are generated: any difference means someone edited them
        # by hand or forgot to regenerate after a spec change.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "Generated client does not match openapi.json. Run ./scripts/regen.sh."
            exit 1
          fi

      - name: Get dependencies
        run: dart pub get

      - name: Analyze
        # Warnings come from the generator itself, so only errors block.
        run: dart analyze --no-fatal-warnings

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
